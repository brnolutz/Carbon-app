<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carbon" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Carbon</title>
    <style>
      html, body { margin:0; padding:0; background:#0B0F14; }
      :root { --header-h: calc(56px + env(safe-area-inset-top, 0px)); }
      #root { min-height:100vh; padding-top:calc(56px + env(safe-area-inset-top, 0px)); }
      html, body, #root, button, input, textarea, select {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body.hide-carbon-header #carbon-header { display: none; }
      #carbon-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        padding-top: env(safe-area-inset-top, 0px);
        background: rgba(8,10,14,0.97);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #carbon-header-inner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
      }
      #carbon-header img {
        width: 18px;
        height: 18px;
        object-fit: contain;
      }
      #carbon-header span {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div id="carbon-header">
      <div id="carbon-header-inner">
        <img src="/carbon-logo.png" alt="Carbon" />
        <span>Carbon</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(()=>{});
        });
      }
    </script>
  </body>
</html>
